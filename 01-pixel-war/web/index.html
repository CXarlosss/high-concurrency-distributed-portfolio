<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel War (r/place) — High-Concurrency Canvas</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f1117;
            color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        header {
            padding: 10px 20px;
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            z-index: 10;
            flex-wrap: wrap;
            gap: 10px;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            padding: 4px 10px;
            border-radius: 12px;
            background: #1c2128;
            border: 1px solid #30363d;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e5534b;
        }
        .status-dot.connected {
            background: #2ea043;
            box-shadow: 0 0 8px #2ea043;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }

        .brush-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #161b22;
            padding: 3px 6px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }

        .brush-btn {
            background: transparent;
            color: #8b949e;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .brush-btn:hover { color: #f0f2f5; }
        .brush-btn.active {
            background: #1f6feb;
            color: #ffffff;
        }

        .sim-btn {
            background: #238636;
            color: #ffffff;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s;
        }
        .sim-btn:hover { background: #2ea043; }
        .sim-btn.active { background: #da3633; }

        .coords-badge {
            font-family: monospace;
            font-size: 12px;
            color: #8b949e;
            background: #161b22;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #30363d;
        }

        #viewport {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            background: #090d16;
        }

        #canvas-wrapper {
            position: absolute;
            transform-origin: 0 0;
            image-rendering: pixelated;
        }

        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 0 1px #30363d;
            background: #ffffff;
            image-rendering: pixelated;
        }

        .help-pill {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid #30363d;
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #8b949e;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.3s;
        }

        footer {
            padding: 10px 20px;
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(8px);
            border-top: 1px solid #30363d;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            z-index: 10;
            overflow-x: auto;
        }

        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s, border-color 0.1s;
            flex-shrink: 0;
        }
        .color-swatch:hover {
            transform: scale(1.15);
        }
        .color-swatch.active {
            border-color: #ffffff;
            transform: scale(1.2);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <header>
        <div class="title-group">
            <h2 style="font-size: 18px;">🎨 Pixel War</h2>
            <span class="status-badge">
                <span id="ws-dot" class="status-dot"></span>
                <span id="ws-status">Conectando...</span>
            </span>
        </div>

        <div class="controls-group">
            <!-- Brush Size Picker -->
            <div class="brush-group">
                <span style="color: #8b949e; font-size: 11px; margin-right: 4px;">TAMAÑO:</span>
                <button class="brush-btn" onclick="setBrush(1)">1px</button>
                <button class="brush-btn active" onclick="setBrush(3)">3px</button>
                <button class="brush-btn" onclick="setBrush(6)">6px</button>
                <button class="brush-btn" onclick="setBrush(10)">10px</button>
            </div>

            <!-- Bot Simulator Toggle -->
            <button id="btn-bots" class="sim-btn" onclick="toggleBotTraffic()">
                <span>⚡ Simular Bots (50 VUs)</span>
            </button>

            <!-- Reset View -->
            <button class="brush-btn" style="border: 1px solid #30363d;" onclick="resetView()">
                <span>Centrar Lienzo</span>
            </button>

            <div class="coords-badge">
                <span id="coords-text">X: 0, Y: 0</span> | <span id="zoom-text">1.0x</span>
            </div>
        </div>
    </header>

    <div id="viewport">
        <div id="canvas-wrapper">
            <canvas id="canvas" width="1000" height="1000"></canvas>
        </div>
        <div class="help-pill" id="help-pill">
            🖱️ Clic o arrastra para pintar • 🔍 Rueda para Zoom • ✋ Shift+Arrastra o botón central para mover
        </div>
    </div>

    <footer id="palette-bar"></footer>

    <script>
        const PALETTE = [
            "#6D001A", "#BE0039", "#FF4500", "#FFA800", "#FFD635", "#FFF8B8",
            "#00A368", "#00CC78", "#7EED56", "#00756F", "#009EAA", "#00CCC0",
            "#2450A4", "#3690EA", "#51E9F4", "#493AC1", "#6A5CFF", "#94B3FF",
            "#811E9F", "#B44AC0", "#E4ABFF", "#DE107F", "#FF3881", "#FF99AA",
            "#6D482F", "#9C6926", "#FFB470", "#000000", "#515252", "#898D90",
            "#D4D7D9", "#FFFFFF"
        ];

        let selectedColor = 2; // Default Orange-Red (#FF4500)
        let brushSize = 3;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        const viewport = document.getElementById('viewport');
        const coordsText = document.getElementById('coords-text');
        const zoomText = document.getElementById('zoom-text');
        const wsDot = document.getElementById('ws-dot');
        const wsStatus = document.getElementById('ws-status');

        // Pan and Zoom State
        let scale = 0.8;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let isPainting = false;
        let startX, startY;

        function updateTransform() {
            wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            zoomText.innerText = scale.toFixed(1) + 'x';
        }

        function resetView() {
            const availW = viewport.clientWidth - 40;
            const availH = viewport.clientHeight - 40;
            scale = Math.min(availW / 1000, availH / 1000, 1.0);
            if (scale < 0.4) scale = 0.4;
            panX = (viewport.clientWidth - 1000 * scale) / 2;
            panY = (viewport.clientHeight - 1000 * scale) / 2;
            updateTransform();
        }
        window.addEventListener('resize', resetView);
        setTimeout(resetView, 50);

        function setBrush(size) {
            brushSize = size;
            document.querySelectorAll('.brush-btn').forEach(b => {
                if (b.innerText === `${size}px`) b.classList.add('active');
                else if (b.innerText.endsWith('px')) b.classList.remove('active');
            });
        }

        // 1. Build Palette Bar
        const paletteBar = document.getElementById('palette-bar');
        PALETTE.forEach((hex, index) => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch' + (index === selectedColor ? ' active' : '');
            swatch.style.backgroundColor = hex;
            swatch.title = `Color ${index} (${hex})`;
            swatch.onclick = () => {
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                swatch.classList.add('active');
                selectedColor = index;
            };
            paletteBar.appendChild(swatch);
        });

        // 2. Fetch Initial 1MB Binary Snapshot
        const basePath = (() => {
            const path = location.pathname.replace(/\/index\.html$/, '');
            return path.endsWith('/') ? path.slice(0, -1) : path;
        })();

        async function loadSnapshot() {
            try {
                const res = await fetch(`${basePath}/canvas`);
                const buf = await res.arrayBuffer();
                const bytes = new Uint8Array(buf);
                const imgData = ctx.createImageData(1000, 1000);
                const data = imgData.data;

                for (let i = 0; i < bytes.length; i++) {
                    const colorIdx = bytes[i];
                    const hex = PALETTE[colorIdx] || "#FFFFFF";
                    const r = parseInt(hex.slice(1, 3), 16);
                    const g = parseInt(hex.slice(3, 5), 16);
                    const b = parseInt(hex.slice(5, 7), 16);

                    const offset = i * 4;
                    data[offset] = r;
                    data[offset + 1] = g;
                    data[offset + 2] = b;
                    data[offset + 3] = 255;
                }
                ctx.putImageData(imgData, 0, 0);
            } catch (err) {
                console.error("Error loading snapshot:", err);
            }
        }
        loadSnapshot();

        // 3. Setup WebSocket Binary Protocol
        let ws;
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}${basePath}/ws`);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                wsDot.classList.add('connected');
                wsStatus.innerText = 'En vivo (5.000 VUs)';
            };

            ws.onclose = () => {
                wsDot.classList.remove('connected');
                wsStatus.innerText = 'Desconectado (Reintentando...)';
                setTimeout(connectWS, 2000);
            };

            ws.onmessage = (e) => {
                const data = new Uint8Array(e.data);
                // Each delta packet is 5 bytes: [X: uint16, Y: uint16, Color: uint8]
                for (let i = 0; i <= data.length - 5; i += 5) {
                    const view = new DataView(data.buffer, data.byteOffset + i, 5);
                    const x = view.getUint16(0, false); // Big-Endian
                    const y = view.getUint16(2, false);
                    const colorIdx = view.getUint8(4);

                    ctx.fillStyle = PALETTE[colorIdx] || "#FFFFFF";
                    ctx.fillRect(x, y, 1, 1);
                }
            };
        }
        connectWS();

        // 4. Coordinate Conversion
        function getCanvasCoords(clientX, clientY) {
            const rect = viewport.getBoundingClientRect();
            const mouseX = clientX - rect.left;
            const mouseY = clientY - rect.top;
            const canvasX = Math.floor((mouseX - panX) / scale);
            const canvasY = Math.floor((mouseY - panY) / scale);
            return { x: canvasX, y: canvasY };
        }

        // 5. Drawing with Brush Size
        function paintBrush(cx, cy, colorIdx) {
            const half = Math.floor(brushSize / 2);
            for (let dy = -half; dy < brushSize - half; dy++) {
                for (let dx = -half; dx < brushSize - half; dx++) {
                    const px = cx + dx;
                    const py = cy + dy;
                    if (px >= 0 && px < 1000 && py >= 0 && py < 1000) {
                        paintPixel(px, py, colorIdx);
                    }
                }
            }
        }

        function paintPixel(x, y, colorIdx) {
            // Local optimistic paint
            ctx.fillStyle = PALETTE[colorIdx];
            ctx.fillRect(x, y, 1, 1);

            // Send 5-byte Big-Endian packet to Go server
            if (ws && ws.readyState === WebSocket.OPEN) {
                const buffer = new ArrayBuffer(5);
                const view = new DataView(buffer);
                view.setUint16(0, x, false); // Big-Endian
                view.setUint16(2, y, false);
                view.setUint8(4, colorIdx);
                ws.send(buffer);
            }
        }

        // Mouse Events
        viewport.onmousemove = (e) => {
            const { x, y } = getCanvasCoords(e.clientX, e.clientY);
            if (x >= 0 && x < 1000 && y >= 0 && y < 1000) {
                coordsText.innerText = `X: ${x}, Y: ${y}`;
            }

            if (isDragging) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            } else if (isPainting) {
                if (x >= 0 && x < 1000 && y >= 0 && y < 1000) {
                    paintBrush(x, y, selectedColor);
                }
            }
        };

        viewport.onmousedown = (e) => {
            if (e.button === 1 || e.shiftKey) { // Middle click or shift+drag for pan
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            } else if (e.button === 0) { // Left click = Paint
                isPainting = true;
                const { x, y } = getCanvasCoords(e.clientX, e.clientY);
                if (x >= 0 && x < 1000 && y >= 0 && y < 1000) {
                    paintBrush(x, y, selectedColor);
                }
            }
        };

        window.onmouseup = () => {
            isDragging = false;
            isPainting = false;
        };

        viewport.onwheel = (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.2 : 0.8;
            const newScale = Math.min(Math.max(scale * zoomFactor, 0.3), 30.0);
            
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        };

        // 6. Interactive Bot Traffic Simulator
        let botInterval = null;
        function toggleBotTraffic() {
            const btn = document.getElementById('btn-bots');
            if (botInterval) {
                clearInterval(botInterval);
                botInterval = null;
                btn.classList.remove('active');
                btn.innerText = "⚡ Simular Bots (50 VUs)";
            } else {
                btn.classList.add('active');
                btn.innerText = "⏹️ Detener Bots";
                let tick = 0;
                botInterval = setInterval(() => {
                    tick++;
                    // Spawn 10 simultaneous pixel writes across the canvas
                    for (let i = 0; i < 10; i++) {
                        const cx = Math.floor(400 + Math.sin(tick * 0.1 + i) * 150);
                        const cy = Math.floor(500 + Math.cos(tick * 0.1 + i) * 150);
                        const c = (tick + i) % PALETTE.length;
                        paintPixel(cx, cy, c);
                    }
                }, 40);
            }
        }
    </script>
</body>
</html>
