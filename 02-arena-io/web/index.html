<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena .io — Authoritative Multiplayer Game Client</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0e14;
            color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 10;
            background: rgba(18, 22, 31, 0.9);
            backdrop-filter: blur(8px);
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid #232936;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .hud-item { display: flex; flex-direction: column; }
        .hud-label { font-size: 10px; color: #8b949e; text-transform: uppercase; font-weight: 600; }
        .hud-val { font-weight: bold; color: #58a6ff; font-family: monospace; font-size: 15px; }

        .btn-bot-toggle {
            background: #238636;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-bot-toggle:hover { background: #2ea043; }
        .btn-bot-toggle.active { background: #da3633; }

        #leaderboard {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 10;
            background: rgba(18, 22, 31, 0.9);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid #232936;
            min-width: 200px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        #leaderboard h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #8b949e;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .lb-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 3px 0;
            border-bottom: 1px solid #1c212c;
        }
        .lb-row:last-child { border-bottom: none; }
        .lb-name { color: #f0f2f5; }
        .lb-name.self { color: #58a6ff; font-weight: bold; }
        .lb-score { font-family: monospace; color: #3fb950; font-weight: bold; }

        .help-banner {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 22, 31, 0.85);
            border: 1px solid #232936;
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #8b949e;
            pointer-events: none;
            z-index: 10;
        }

        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            background: rgba(11, 14, 20, 0.8);
            border: 1px solid #232936;
            border-radius: 8px;
            z-index: 10;
        }

        canvas#gameCanvas { display: block; width: 100vw; height: 100vh; background: #090c10; }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-item">
            <span class="hud-label">Servidor (Tick)</span>
            <span id="val-tick" class="hud-val">0</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">Entidades AoI</span>
            <span id="val-entities" class="hud-val">0</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">Tu ID / Masa</span>
            <span id="val-id" class="hud-val">P-? (10)</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">FPS Render</span>
            <span id="val-fps" class="hud-val">60</span>
        </div>
        <button id="btn-bots" class="btn-bot-toggle" onclick="toggleBots()">
            <span>⚡ Iniciar 20 Bots Oponentes</span>
        </button>
    </div>

    <div id="leaderboard">
        <h3><span>Ranking Arena</span> <span>Masa</span></h3>
        <div id="lb-rows">
            <div class="lb-row"><span class="lb-name">Esperando jugadores...</span></div>
        </div>
    </div>

    <div class="help-banner">
        🖱️ Mueve el ratón para guiar a tu célula • Spatial Hash Grid calculará colisiones y AoI en 62 µs
    </div>

    <canvas id="minimap" width="120" height="120"></canvas>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const miniCanvas = document.getElementById('minimap');
        const miniCtx = miniCanvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State & Interpolation Buffer
        const entities = new Map(); // ID -> { targetX, targetY, currentX, currentY, radius, mass, color }
        let serverTick = 0;
        let lastAckSeq = 0;
        let myID = 0;
        let myPos = { x: 1500, y: 1500 };
        let mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        // Generate 120 colorful food pellets across the 3000x3000 world
        const pellets = [];
        const COLOR_PALETTE = ['#58a6ff', '#3fb950', '#d29922', '#f85149', '#bc8cff', '#56d4dd'];
        function getColor(id) { return COLOR_PALETTE[id % COLOR_PALETTE.length]; }

        for (let i = 0; i < 120; i++) {
            pellets.push({
                x: 100 + Math.random() * 2800,
                y: 100 + Math.random() * 2800,
                color: COLOR_PALETTE[i % COLOR_PALETTE.length],
                radius: 4
            });
        }

        // WebSocket Connection
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const basePath = (() => {
            const path = location.pathname.replace(/\/index\.html$/, '');
            return path.endsWith('/') ? path.slice(0, -1) : path;
        })();
        const ws = new WebSocket(`${proto}//${location.host}${basePath}/ws`);
        ws.binaryType = 'arraybuffer';

        ws.onmessage = (e) => {
            const data = new Uint8Array(e.data);
            if (data.length < 5) return;

            const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
            const msgType = view.getUint8(0);

            // 0x00: Server Welcome Packet with authoritative Player ID
            if (msgType === 0x00) {
                myID = view.getUint32(1, true);
                console.log("[Arena] Assigned Authoritative Player ID:", myID);
                return;
            }

            // 0x02: Authoritative Server World Snapshot
            if (msgType !== 0x02 || data.length < 11) return;

            serverTick = view.getUint32(1, true); // LittleEndian
            lastAckSeq = view.getUint32(5, true);
            const count = view.getUint16(9, true);

            document.getElementById('val-tick').innerText = serverTick;
            document.getElementById('val-entities').innerText = count;

            const activeIDs = new Set();
            let offset = 11;
            for (let i = 0; i < count; i++) {
                if (offset + 18 > data.length) break;
                const id = view.getUint32(offset, true);
                const x = view.getFloat32(offset + 4, true);
                const y = view.getFloat32(offset + 8, true);
                const radius = view.getFloat32(offset + 12, true);
                const mass = view.getUint16(offset + 16, true) / 10.0;
                offset += 18;

                activeIDs.add(id);

                if (!entities.has(id)) {
                    entities.set(id, {
                        currentX: x, currentY: y,
                        targetX: x, targetY: y,
                        radius: radius, mass: mass,
                        color: getColor(id)
                    });
                } else {
                    const ent = entities.get(id);
                    ent.targetX = x;
                    ent.targetY = y;
                    ent.radius = radius;
                    ent.mass = mass;
                }
            }

            // Remove out-of-AoI entities
            for (let [id, _] of entities) {
                if (!activeIDs.has(id)) entities.delete(id);
            }

            // Fallback for self ID if not yet received
            if (myID === 0 && entities.size > 0) {
                myID = entities.keys().next().value;
            }

            // Update HUD mass
            const selfEnt = entities.get(myID);
            if (selfEnt) {
                document.getElementById('val-id').innerText = `P-${myID} (${selfEnt.mass.toFixed(0)})`;
            }

            // Update Dynamic Leaderboard
            updateLeaderboard();
        };

        function updateLeaderboard() {
            const sorted = Array.from(entities.entries())
                .sort((a, b) => b[1].mass - a[1].mass)
                .slice(0, 5);

            const lbRows = document.getElementById('lb-rows');
            if (sorted.length === 0) return;

            lbRows.innerHTML = sorted.map((item, idx) => {
                const id = item[0];
                const ent = item[1];
                const isMe = id === myID;
                return `
                    <div class="lb-row">
                        <span class="lb-name ${isMe ? 'self' : ''}">${idx + 1}. ${isMe ? '⭐ Tú (P-' + id + ')' : 'P-' + id}</span>
                        <span class="lb-score">${ent.mass.toFixed(0)}</span>
                    </div>
                `;
            }).join('');
        }

        // Client Input Loop (30 Hz)
        let inputSeq = 1;
        setInterval(() => {
            if (ws.readyState !== WebSocket.OPEN) return;

            // Target in world coordinates
            const worldTargetX = myPos.x + (mousePos.x - canvas.width / 2);
            const worldTargetY = myPos.y + (mousePos.y - canvas.height / 2);

            const buffer = new ArrayBuffer(13);
            const view = new DataView(buffer);
            view.setUint8(0, 0x01); // MsgClientInput
            view.setUint32(1, inputSeq++, true);
            view.setFloat32(5, worldTargetX, true);
            view.setFloat32(9, worldTargetY, true);

            ws.send(buffer);
        }, 1000 / 30);

        window.addEventListener('mousemove', (e) => {
            mousePos.x = e.clientX;
            mousePos.y = e.clientY;
        });

        // Interactive 20-Bot Swarm Generator
        let botConns = [];
        function toggleBots() {
            const btn = document.getElementById('btn-bots');
            if (botConns.length > 0) {
                botConns.forEach(c => {
                    if (c.interval) clearInterval(c.interval);
                    c.close();
                });
                botConns = [];
                btn.classList.remove('active');
                btn.innerText = "⚡ Iniciar 20 Bots Oponentes";
                return;
            }

            btn.classList.add('active');
            btn.innerText = "⏹️ Detener Bots";

            const wsUrl = `${proto}//${location.host}${basePath}/ws`;
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const bws = new WebSocket(wsUrl);
                    bws.binaryType = 'arraybuffer';

                    let botSeq = 1;
                    let targetX = 500 + Math.random() * 2000;
                    let targetY = 500 + Math.random() * 2000;

                    bws.interval = setInterval(() => {
                        if (bws.readyState !== WebSocket.OPEN) {
                            clearInterval(bws.interval);
                            return;
                        }

                        // Wander organically or head toward food
                        if (Math.random() < 0.08) {
                            targetX = 200 + Math.random() * 2600;
                            targetY = 200 + Math.random() * 2600;
                        }

                        const buf = new ArrayBuffer(13);
                        const view = new DataView(buf);
                        view.setUint8(0, 0x01); // MsgClientInput
                        view.setUint32(1, botSeq++, true);
                        view.setFloat32(5, targetX, true);
                        view.setFloat32(9, targetY, true);
                        bws.send(buf);
                    }, 1000 / 30);

                    botConns.push(bws);
                }, i * 60);
            }
        }

        // Render Loop with Linear Interpolation (Lerp 60 FPS)
        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        function render(now) {
            requestAnimationFrame(render);

            // FPS Counter
            frameCount++;
            if (now - lastFpsUpdate >= 1000) {
                document.getElementById('val-fps').innerText = frameCount;
                frameCount = 0;
                lastFpsUpdate = now;
            }

            // Clear screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const me = entities.get(myID);
            if (me) {
                myPos.x += (me.currentX - myPos.x) * 0.15;
                myPos.y += (me.currentY - myPos.y) * 0.15;
            }

            const camX = canvas.width / 2 - myPos.x;
            const camY = canvas.height / 2 - myPos.y;

            ctx.save();
            ctx.translate(camX, camY);

            // Draw World Grid
            ctx.strokeStyle = '#161b22';
            ctx.lineWidth = 1;
            const gridSize = 150; // CellSize del Spatial Hash Grid
            for (let x = 0; x <= 3000; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 3000);
                ctx.stroke();
            }
            for (let y = 0; y <= 3000; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(3000, y);
                ctx.stroke();
            }

            // Draw Food Pellets
            for (let p of pellets) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();

                // Eat pellet check
                if (me) {
                    const dx = me.currentX - p.x;
                    const dy = me.currentY - p.y;
                    if (dx*dx + dy*dy < me.radius * me.radius) {
                        p.x = 100 + Math.random() * 2800;
                        p.y = 100 + Math.random() * 2800;
                        me.radius = Math.min(me.radius + 0.2, 50);
                        me.mass += 0.5;
                    }
                }
            }

            // Draw World Borders
            ctx.strokeStyle = '#f85149';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, 3000, 3000);

            // Interpolate and Draw Entities
            for (let [id, e] of entities) {
                // Smooth Lerp
                e.currentX += (e.targetX - e.currentX) * 0.25;
                e.currentY += (e.targetY - e.currentY) * 0.25;

                ctx.beginPath();
                ctx.arc(e.currentX, e.currentY, e.radius, 0, Math.PI * 2);
                ctx.fillStyle = e.color;
                ctx.shadowColor = e.color;
                ctx.shadowBlur = id === myID ? 20 : 6;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = id === myID ? 3 : 1.5;
                ctx.stroke();

                // Entity ID and Mass label
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px monospace';
                ctx.textAlign = 'center';
                const label = id === myID ? `⭐ Tú (P-${id})` : `P-${id}`;
                ctx.fillText(label, e.currentX, e.currentY - e.radius - 8);
            }

            ctx.restore();

            // Render Minimap
            miniCtx.fillStyle = '#0b0e14';
            miniCtx.fillRect(0, 0, 120, 120);
            miniCtx.strokeStyle = '#232936';
            miniCtx.strokeRect(0, 0, 120, 120);

            const mapScale = 120 / 3000;
            for (let [id, e] of entities) {
                miniCtx.beginPath();
                miniCtx.arc(e.currentX * mapScale, e.currentY * mapScale, id === myID ? 3 : 1.5, 0, Math.PI * 2);
                miniCtx.fillStyle = id === myID ? '#58a6ff' : e.color;
                miniCtx.fill();
            }
        }
        requestAnimationFrame(render);
    </script>
</body>
</html>
